name: Coach checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python science-based-coach/scripts/coach_tools.py validate --log coach-data/danya/events.jsonl
      - run: python science-based-coach/scripts/coach_tools.py audit-sources --registry science-based-coach/references/sources.json
      - run: python science-based-coach/scripts/validate_pack.py --scenarios tests/coach-scenarios.json
